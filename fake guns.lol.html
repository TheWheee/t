    <style>
      body {

      /* click to enter */
      #overlay {

      }

      /* audio thingie */
      #audio-controls {

    <!-- audio control -->
    <div id="audio-controls">
      <button id="mute-btn" onclick="toggleMute()">mute?</button>
      <input
        type="range"
        id="volume-slider"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
        oninput="changeVolume(this.value)"
      />
    </div>

    <!-- bg song -->
    <audio id="bg-music" loop>
      <source
        src="https://file.garden/arMUwFYb6e4XlKHQ/hoe%20(slowed)%20(prod.%20ICYTWAT).mp3"
        type="audio/mpeg"
      />
    </audio>

    <script>
      const music = document.getElementById("bg-music");
      const muteBtn = document.getElementById("mute-btn");
      const volumeSlider = document.getElementById("volume-slider");

      // 50 percent audio
      music.volume = 0.5;

      function enterSite() {
        music.play().catch((error) => console.log("Playback blocked:", error));

        document.getElementById("overlay").classList.add("fade-out");

        document.getElementById("audio-controls").classList.add("show");
      }

      // un/mute buttons
      function toggleMute() {
        if (music.muted) {
          music.muted = false;
          muteBtn.innerText = "unmute?";
          volumeSlider.value = music.volume;
        } else {
          music.muted = true;
          muteBtn.innerText = "unmute?";
          volumeSlider.value = 0;
        }
      }

      function changeVolume(volumeValue) {
        music.volume = volumeValue;

        if (volumeValue == 0) {
          music.muted = true;
          muteBtn.innerText = "mute?";
        } else {
          music.muted = false;
          muteBtn.innerText = "unmute?";
        }
      }
    </script>
